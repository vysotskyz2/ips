services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: belarus_cadastral_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadastral
      POSTGRES_PASSWORD: cadastral_pass
      POSTGRES_DB: belarus_cadastral
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastral -d belarus_cadastral"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: belarus_cadastral_web
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cadastral:cadastral_pass@postgis:5432/belarus_cadastral
      ENABLE_LIVE_OSM_ENRICHMENT: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  postgis_data:
